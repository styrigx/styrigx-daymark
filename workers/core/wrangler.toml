# styrigx-daymark-core：日刻的核心 Worker（存句子、读句子、今日一句）（CI 部署；承接 daymark.styrigx.com/api/*）
#
# 全部后端代码都在本目录：src/（入口、路由表、接口）+ migrations/（D1）。
# Pages（styrigx-daymark，配置见 web/wrangler.toml）只放静态文件；页面的会话检查在主站鉴权网关。
#
# 安全：
# - 本 Worker 不持任何钥匙。会话交给鉴权网关验（服务绑定 AUTH → SessionVerifier）。
# - workers_dev = false、preview_urls = false：只通过 daymark.styrigx.com 的路由访问（它连的是正式 D1）。

name = "styrigx-daymark-core"
main = "src/index.js"
compatibility_date = "2026-10-20"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由：daymark.styrigx.com/api/*。网关另有更精确的 daymark.styrigx.com/api/session-check（精确路径优先），
# 页面路径登记在网关（styrigx-space 仓库 workers/auth-gateway/wrangler.toml），这里只管接口。
[[routes]]
pattern = "daymark.styrigx.com/api/*"
zone_name = "styrigx.com"

[[d1_databases]]
binding = "DB"
database_name = "styrigx-daymark"
database_id = "fe279c28-18e3-4931-b12a-46e344ad36ec"
migrations_dir = "migrations"

# 验票：主站鉴权网关的 RPC 入口（session）。
[[services]]
binding = "AUTH"
service = "styrigx-auth-gateway"
entrypoint = "SessionVerifier"
