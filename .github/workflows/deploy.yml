name: Build and Deploy (daymark Pages + styrigx-daymark-core)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支推新提交时取消旧的 PR CI；main 的部署永不取消（排队按顺序跑，D1 迁移 / core / Pages 不会交错）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN 默认只读；本工作流不推代码、不发评论、不建 release
permissions:
  contents: read

env:
  # 所有 wrangler（npx 和 wrangler-action）用同一个固定版本，和主站 styrigx-space 一致；升级时只改这里
  WRANGLER_VERSION: '4.152.0'

# 构建环境（Hugo 版本与 extended、Node + npm ci、Playwright 浏览器缓存）用主站 styrigx-space 的共享 composite action，
# 按固定 tag 引用（不跟主站 main）；Renovate 在 styrigx-space 发新 tag 后开 PR 升级（见主站 .github/actions/README.md）。
# 部署 job 不用共享 action：密钥和 environment 只出现在本文件里。
jobs:
  # 作业名保持 build-and-deploy 不变（规则集 protect-main 的必需检查按这个名字认）
  build-and-deploy:
    # 固定 runner 大版本：ubuntu-latest 换大版本时系统库 / 字体会变
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Assert zero-key layout
        # 本仓库不持任何钥匙：页面会话在主站鉴权网关验，接口（workers/core）经服务绑定问网关。
        # 仓库里不许有 Pages Functions，不许出现钥匙变量名或会话验签代码。
        run: |
          set -u
          if [ -e functions ] || [ -e web/functions ]; then echo "FAIL: Pages Functions must not exist"; exit 1; fi
          # SGX_[A-Z0-9_]*(…)：连 SGX_PW_PEPPER、SGX_CHAT_API_KEY、SGX_ROOT_KEY 这类名字一起拦
          if grep -rn -E "SGX_[A-Z0-9_]*(PUBLIC|PRIVATE|KEY|PEPPER)|SGX_ED25519_|SGX_STEPUP_" \
               --include="*.js" --include="*.mjs" --include="*.toml" --include="*.html" web/ workers/ scripts/ 2>/dev/null; then
            echo "FAIL: daymark must not hold keys"; exit 1
          fi
          echo "OK: zero-key layout."

      - name: Setup Hugo (styrigx-space shared action; version + extended defined there)
        uses: styrigx/styrigx-space/.github/actions/setup-hugo@v1.0.0

      - name: Setup Node + install dependencies (styrigx-space shared action, npm cache)
        # Node 22：测试里用 node:sqlite 真跑 D1 的 SQL
        uses: styrigx/styrigx-space/.github/actions/setup-node-deps@v1.0.0
        with:
          node-version: '22'

      - name: Shared shell copy matches the pinned main-site commit (scripts/sync-shell.mjs --check)
        # 色彩角色 / 顶栏材质 / 导航抽屉 / 自定义主题色引擎来自主站 styrigx-space web/shared/shell，主站是唯一来源：
        # 副本被手改，或和 sgx-shell.lock.json 锁定的主站提交对不上 → 红。主站 main 上外壳更新了只打 notice，不变红；
        # 升级外壳：node scripts/sync-shell.mjs（锁定到主站 main 当时的提交）后提交
        run: node scripts/sync-shell.mjs --check

      - name: Build CSS
        run: npm run build:css

      - name: Run tests
        run: npm test

      - name: core bundle check (dry-run)
        working-directory: workers/core
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir "$RUNNER_TEMP/core-dist"

      - name: Build site
        run: hugo --minify -s web

      - name: Playwright Chromium (styrigx-space shared action, browser cache keyed by lockfile version)
        uses: styrigx/styrigx-space/.github/actions/setup-playwright@v1.0.0

      - name: Run phone E2E
        run: npm run test:e2e

      - name: Check no unversioned /js/ refs in build output
        run: |
          refs=$(grep -rhoE 'src="/js/[a-zA-Z0-9_./-]+\.js"' web/public/ 2>/dev/null | sort -u || true)
          bad=$(echo "$refs" | grep -vE '\.[0-9a-f]{8,}\.(js|mjs)"' | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: Found unversioned /js/ refs in build output:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all /js/ refs are fingerprinted."

      - name: Check no image files in build output
        # 图片一律要过会话（2026-10-29）：Pages 不验会话，所以构建产物里一张图片都不许有；
        # 图片只能从接口 Worker 的 /api/* 出（先问网关会话）。web/static/_worker.js 运行时也会把像图片的回答一律 404。
        run: |
          bad=$(find web/public -type f | grep -iE '\.(png|apng|jpe?g|jfif|pjpeg|pjp|gif|webp|avif|svgz?|ico|cur|bmp|tiff?|heic|heif|jxl)$' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: image files in build output (images must go through a session-checked /api/* endpoint):"
            echo "$bad"
            exit 1
          fi
          echo "OK: no image files in build output."

      - name: Upload site build
        # 部署 job 直接用这份产物，不再重建
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-public
          path: web/public
          retention-days: 1

  # 只在 main 推送时部署，测试 job 不碰任何钥匙。命名一一对应（同 auth gateway）：
  #   Cloudflare token 名 = GitHub 环境名 = 环境密钥名（大写、横线换下划线）
  #   styrigx-daymark-core-deploy  -> STYRIGX_DAYMARK_CORE_DEPLOY   core Worker 的 D1 迁移 + 部署（环境密钥，环境只允许 main）
  #   styrigx-daymark-pages-deploy -> STYRIGX_DAYMARK_PAGES_DEPLOY  Cloudflare Pages（仓库级密钥，同 space：只能推静态页面，不碰数据）
  # 各 token 的具体权限以 Cloudflare 上 2026-10-26 按代码收紧后的为准，不在这里重复。
  # 只有 core 环境限 main；CLOUDFLARE_ACCOUNT_ID 不是钥匙，留在仓库级。
  deploy-core:
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: STYRIGX_DAYMARK_CORE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Gate check - gateway must already guard daymark pages and expose AuthVerifier
        # Pages 没有验票代码、core 要经服务绑定问网关：网关必须先登记 daymark.styrigx.com。
        # 未登录访问首页必须是网关回的 302（带 X-SGX-Runtime: worker）。不满足就什么都不部署。
        # 例外：首次部署时域名还没解析（Pages 自定义域名要等项目建好后再绑），这时页面不对外，放行。
        run: |
          set -u
          if ! getent hosts daymark.styrigx.com >/dev/null; then echo "daymark.styrigx.com not resolvable yet: first deploy, skip gate"; exit 0; fi
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://daymark.styrigx.com/ | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "daymark.styrigx.com/ -> $code runtime=${rt:-none}"
          [ "$code" = "302" ] && [ "$rt" = "worker" ] || { echo "::error::gateway is not guarding daymark.styrigx.com yet; deploy the gateway first"; exit 1; }
          # core 的服务绑定是 entrypoint = "AuthVerifier"（lockSession）：网关必须已是带 AuthVerifier 的版本。
          # 同一版网关才有 daymark.styrigx.com/api/lock-session-check 这条精确路由：未登录要网关回 401（X-SGX-Runtime: worker），
          # 落到 core（X-Daymark-Runtime）说明网关还是旧版，不部署。
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://daymark.styrigx.com/api/lock-session-check | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "daymark.styrigx.com/api/lock-session-check -> $code runtime=${rt:-none}"
          [ "$code" = "401" ] && [ "$rt" = "worker" ] || { echo "::error::gateway does not answer /api/lock-session-check yet (no AuthVerifier); deploy the main-site gateway first"; exit 1; }

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_DAYMARK_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-daymark-core --remote

      - name: Deploy styrigx-daymark-core
        # 先部署接口 Worker（路由 daymark.styrigx.com/api/* 优先于 Pages），再部署 Pages。
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_DAYMARK_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test core (must be served by the Worker)
        run: |
          set -u
          if ! getent hosts daymark.styrigx.com >/dev/null; then echo "domain not bound yet: skip"; exit 0; fi
          check() { # 路径 期望状态码 期望的标记头
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://daymark.styrigx.com$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' -v h="$(echo "$3" | tr A-Z a-z)" 'tolower($1)==h{print $2}')
              echo "$1 -> $code $3=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 with $3: worker"; return 1
          }
          ok=0
          check /api/quotes 401 X-Daymark-Runtime || ok=1
          check /api/today 200 X-Daymark-Runtime || ok=1
          check /api/lock-session-check 401 X-SGX-Runtime || ok=1
          exit $ok

  deploy-pages:
    needs: deploy-core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # web/wrangler.toml 要跟着部署
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download site build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-public
          path: web/public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_DAYMARK_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy public --project-name=styrigx-daymark --commit-dirty=true

      - name: Smoke test Pages (pages behind the gateway, static files direct, pages.dev not open)
        run: |
          set -u
          if ! getent hosts daymark.styrigx.com >/dev/null; then echo "domain not bound yet: skip"; exit 0; fi
          ok=0
          probe() { # url 期望状态码 期望 X-SGX-Runtime(worker|none)
            for i in 1 2 3; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "${rt:-none}" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 runtime=$3"; return 1
          }
          for p in / /en/ /zh/ /sitemap.xml; do probe "https://daymark.styrigx.com$p" 302 worker || ok=1; done
          js=$(cd web/public && find js -maxdepth 1 -name '*.js' | head -1)
          [ -n "$js" ] && { probe "https://daymark.styrigx.com/$js" 200 none || ok=1; }
          # 图片一律要过会话：没会话取图片路径不得拿到图片。现在网关对图片后缀直接回源，Pages 的 _worker.js 回 404；
          # 网关以后改成图片也验会话时是 302 到锁屏。两种都算过，200 或其它一律红。
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://daymark.styrigx.com/sgx-image-probe.png" | tr -d '\r' || true)
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          ct=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "/sgx-image-probe.png -> $code ${ct:-no-type}"
          case "$code" in 404|302) ;; *) echo "::error::image path without session answered $code"; ok=1 ;; esac
          case "$ct" in image/*) echo "::error::image path without session returned an image"; ok=1 ;; esac
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx-daymark.pages.dev/ | tr -d '\r' || true)
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "pages.dev / -> $code $loc"
          # pages.dev 不得公开：要么被 Zero Trust Access 拦（302 到 styrigx.cloudflareaccess.com，2026-10-21 起），要么 301 到正式域名
          case "$code $loc" in
            "301 https://daymark.styrigx.com/") ;;
            "302 https://styrigx.cloudflareaccess.com/cdn-cgi/access/login/styrigx-daymark.pages.dev"*) ;;
            *) echo "::error::pages.dev is neither behind Cloudflare Access nor redirected to daymark.styrigx.com"; ok=1 ;;
          esac
          exit $ok
